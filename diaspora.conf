# diaspora.conf - the peers of this repository, what moves between them and
# what an import must pass.  Read by diaspora (github.com/kev-cam/diaspora).
# Values run to the end of the line as written; comments are whole lines.
# Settings for one machine only go in diaspora.local.conf (not committed).

[diaspora]
	target = main
	import = bugfix security perf
	ignore = docs ci style
	export = bugfix

# Stephen Williams's Icarus Verilog.  This repository began as a copy of its
# files, not of its history, so every commit of his looks new to git.  The
# last "Sync with upstream" here (572cfe915, 2025-12-05) took his tree at
# 4f31fec5c; what he did up to there is not looked at again.
[peer "steve"]
	url = https://github.com/steveicarus/iverilog.git
	branch = master
	since = 4f31fec5c8a448d5eace99662da4e49a28b5870e

# Nearly every commit, ours and the peer's, adds a line to an ivtest
# regress-*.list; both sides changing one is not counted as touching our
# files.
[divergence]
	lists = ivtest/regress-*.list

# iverilog is built in its source tree, so here in the import worktree
# ($DIASPORA_SRC), and installed under its _install, where the regress
# harness looks for an iverilog to test (as `regress gate` builds it).  The
# worktree is kept between runs, so only the first build is long.
# autoconf.sh and configure run again when the build system's inputs change.
[test "compile"]
	run = cd "$DIASPORA_SRC" && sig=$(git ls-files -s configure.ac aclocal.m4 autoconf.sh '*Makefile.in' '*.gperf' | sha1sum) && { [ "$sig" = "$(cat .buildsys 2>/dev/null)" ] || { sh autoconf.sh && sh ./configure --prefix="$DIASPORA_SRC/_install" && echo "$sig" > .buildsys; }; }
	run = rm -f version_tag.h && smak -j"$(nproc)" && make -j"$(nproc)" && make install
	timeout = 1h

# The blocks `regress gate --repo iverilog` runs (ivtest and sv-tests with
# this iverilog, ivtest through nvc), on the import's build.  Many of their
# tests fail on main, so the gate is that no test fails that did not fail
# before the import; a new failure is run a second time before it counts.
[test "full-regression"]
	needs = compile
	run = "${SV2GHDL_SRC_ROOT:-/usr/local/src}/sv2ghdl/regress/regress" candidate --repo iverilog --src "$DIASPORA_SRC" --failures "$DIASPORA_FAILURES"
	pass = no-new-failures
	retry = 1
	timeout = 2h

# Every import passes the full regression, whatever kind of change it is.
[require]
	default = full-regression
